<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="icon" type="image/x-icon" href="">

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="main-content">
        <div class="container">
            <!-- Header section -->
            <header class="header">
                <h1><span>YouTube</span> Downloader</h1>
                <p>Paste the link below and convert it to MP4 or MP3 format.</p>
            </header>

            <!-- Main Card -->
            <div class="card">
                <div class="form-group">
                    <label for="youtube-url">YouTube URL</label>
                    <div class="input-group">
                        <input type="url" value="" id="youtube-url" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div id="preview-container" class="hidden">
                        <iframe id="youtube-preview" frameborder="0"></iframe>
                    </div>
                </div>
                
                <div class="options-grid">
                    <!-- Format -->
                    <div class="form-group">
                        <label for="format-select">Format</label>
                        <div class="select-wrapper">
                            <select id="format-select">
                                <option value="mp4">MP4 (Video)</option>
                                <option value="mp3">MP3 (Audio)</option>
                            </select>
                            <i data-feather="chevron-down" class="select-icon"></i>
                        </div>
                    </div>

                    <!-- Video Quality -->
                    <div class="form-group" id="quality-container">
                        <label for="quality-select">Resolution</label>
                        <div class="select-wrapper">
                            <select id="quality-select">
                                <option value="high">1920x1080p</option>
                                <option value="medium">1280x720p</option>
                                <option value="low">720x480p</option>
                            </select>
                            <i data-feather="chevron-down" class="select-icon"></i>
                        </div>
                    </div>
                    
                    <!-- Audio Quality -->
                    <div class="form-group hidden" id="audio-quality-container">
                        <label for="audio-quality-select">Quality</label>
                        <div class="select-wrapper">
                            <select id="audio-quality-select">
                                <option value="320">320 kbps</option>
                                <option value="256">256 kbps</option>
                                <option value="192">192 kbps</option>
                                <option value="128">128 kbps</option>
                                <option value="64">64 kbps</option>
                            </select>
                            <i data-feather="chevron-down" class="select-icon"></i>
                        </div>
                    </div>
                </div>
                
                <button id="download-btn" class="btn-primary">
                    <i data-feather="download"></i>
                    Download Now
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>by ResonnDev | <a href="https://github.com/resonnxdev/youtube_downloader" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <script src="{{url_for('static', filename='script.js')}}"></script>
    <script>feather.replace()</script>
</body>
</html>
